/* tokens follow design-system v0.1 — breakpoints: desktop >= 1200 / tablet 768-1199 / mobile <= 767
   plus a short-landscape mode for phones turned sideways */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --color-ink:#27335E;
  --color-horizon-cream:#EDD9C5;
  --glass-top:rgba(255,255,255,.10);
  --glass-bottom:rgba(255,255,255,.03);
  --glass-edge:rgba(255,255,255,.58);
  --glass-shadow:rgba(60,48,90,.10);
  /* D = the display unit. Everything in the hero is a ratio of it:
     title 1D, sub 0.5D, hint 0.18D (min 13px), icons 1.2D, bear 2.4D.
     It follows the smaller of width and height, because the hero is one screen, not a scrolling page. */
  --D:clamp(56px,min(7.2vw,11vh),112px);
  --type-display:var(--D);
  --type-sub:calc(var(--D)*.5);
  --type-hint:max(13px,calc(var(--D)*.18));
  --icon-size:calc(var(--D)*1.2);
  --bear-w:calc(var(--D)*2.4);
  --bear-scale:.4167;
  --rail-w:clamp(320px,27vw,420px);
  --rail-h:clamp(176px,30svh,236px);
  --folder-gap:46px;
  --peek-rise:-9cqi;
  --rail-fade:4%;
  --page-pad:clamp(24px,3.4vw,52px);
  --nav-h:46px;
  --sky-pos:30% 45%;
  --axis:y;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --color-ink:#27335E; } }
:root[data-theme="dark"]{ --color-ink:#27335E; }
@media (max-width:1199px){
  :root{ --rail-w:clamp(250px,32vw,320px); --folder-gap:34px; --D:clamp(40px,min(7.6vw,8.5vh),88px); }
}
@media (max-width:767px){
  :root{ --folder-gap:16px; --rail-fade:8%; --nav-h:42px; --peek-rise:-6cqi;
         --D:clamp(36px,min(12.5vw,6.5vh),60px); --bear-w:calc(var(--D)*2.8); --axis:x; }
}
/* phone turned sideways: too short for a bottom rail, so keep the side rail and shrink everything */
@media (orientation:landscape) and (max-height:520px){
  :root{ --rail-w:220px; --folder-gap:24px; --rail-fade:6%; --nav-h:38px; --page-pad:16px; --peek-rise:-7cqi;
         --D:clamp(26px,min(5vw,9vh),40px); --icon-size:calc(var(--D)*1.4); --bear-w:calc(var(--D)*3); --axis:y; }
}

*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
body{

  font-family:'Bricolage Grotesque',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}

.frame{ position:relative; z-index:1; height:100%; display:grid; grid-template-columns:minmax(0,1fr) var(--rail-w); }

/* ---------- clear glass (shared by the top bar, tooltips and the copied toast) ----------
   almost no tint and only a light blur: the sky stays visible through it, and the shape
   is carried by bright rim light on the edges rather than by a fill */
.glass{
  background:linear-gradient(180deg,var(--glass-top),var(--glass-bottom));
  -webkit-backdrop-filter:blur(4px) saturate(118%) brightness(1.03); backdrop-filter:blur(4px) saturate(118%) brightness(1.03);
  border:1px solid var(--glass-edge);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.95),
    inset 0 -1px 1px rgba(255,255,255,.45),
    inset 1px 0 1px rgba(255,255,255,.3),
    inset -1px 0 1px rgba(255,255,255,.3),
    inset 0 0 14px rgba(255,255,255,.16),
    0 6px 20px var(--glass-shadow);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
  position:relative; isolation:isolate;
}
.glass::before{ /* thin specular sheen hugging the top edge */
  content:''; position:absolute; inset:1px 1px 62% 1px; border-radius:inherit; z-index:-1; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{ background:rgba(255,255,255,.82); }
}

/* ---------- top bar ---------- */
.topbar{
  position:absolute; z-index:6; top:var(--page-pad); right:var(--page-pad);
  height:var(--nav-h); display:flex; align-items:center; gap:2px; padding:0 5px 0 18px; border-radius:999px;
  font-size:15px; white-space:nowrap;
}
.topbar .who{ font-weight:800; letter-spacing:-.01em; margin-right:10px; }
.topbar .lnk{
  display:inline-flex; align-items:center; gap:6px; height:calc(var(--nav-h) - 10px); padding:0 13px; border-radius:999px;
  font-weight:600; text-decoration:none; transition:background-color .2s ease;
}
.topbar .lnk svg{ width:15px; height:15px; flex:none; }
.topbar .lnk:hover{ background:rgba(255,255,255,.2); box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
.topbar .lnk:focus-visible{ outline:2px solid var(--color-ink); outline-offset:1px; }
.copied{
  position:absolute; top:calc(100% + 8px); right:6px; padding:6px 11px; border-radius:12px; font-size:13px; font-weight:600;
  opacity:0; transform:translateY(-4px); transition:opacity .2s ease, transform .2s ease; pointer-events:none;
}
.copied.show{ opacity:1; transform:none; }

/* ---------- hero ---------- */
.hero{ position:relative; min-width:0; min-height:0; }
.intro{ position:absolute; left:var(--page-pad); top:var(--page-pad); z-index:2; }
.t1{
  margin:0; font-weight:800; font-size:var(--type-display); line-height:.9; letter-spacing:-.035em;
  font-variation-settings:"opsz" 96;
}
.t1 span{ display:block; }
.hint{ margin:.9em 0 0; font-weight:500; font-size:var(--type-hint); letter-spacing:-.005em; opacity:.85; }
.t2{
  position:absolute; left:var(--page-pad); bottom:var(--page-pad); margin:0; z-index:2;
  font-weight:500; font-size:var(--type-sub); line-height:1; letter-spacing:-.02em;
}
.t2 b{ display:block; font-weight:500; font-size:.7em; margin-bottom:.1em; opacity:.8; }

/* below desktop the top bar stacks above the title instead of sitting beside it */
@media (max-width:1199px){
  .topbar{ right:auto; left:var(--page-pad); }
  .intro{ top:calc(var(--page-pad) + var(--nav-h) + 18px); }
}
@media (max-width:767px){

.bear{

}

.bear .body{ top:calc(321px*var(--bear-scale)); }

.bear .headg img{ top:0; }
.bear .face{ position:absolute; inset:0; transition:transform .18s ease; }
.bear .face i{ position:absolute; background:#0A0A0A; }
.bear .eye{ top:calc(213px*var(--bear-scale)); width:calc(24px*var(--bear-scale)); height:calc(24px*var(--bear-scale)); }
.bear .eye.l{ left:calc(159px*var(--bear-scale)); }
.bear .eye.r{ left:calc(384px*var(--bear-scale)); }
.bear .mouth{ left:calc(261px*var(--bear-scale)); top:calc(263px*var(--bear-scale)); width:calc(36px*var(--bear-scale)); height:calc(12px*var(--bear-scale)); }
.bear.blink .eye{ transform:scaleY(.16); }
/* idle hop: pixel-game style, straight up about 6pt and back, in hard steps (no easing, no squash) */
.bear.jump{ animation:hop .42s steps(1,end); }
@keyframes hop{
  0%  { translate:0 0; }
  20% { translate:0 -4px; }
  40% { translate:0 -8px; }
  65% { translate:0 -4px; }
  85% { translate:0 0; }
  100%{ translate:0 0; }
}

.bear::after{
  content:''; position:absolute; left:50%; bottom:-10px; width:62%; height:16px; transform:translateX(-50%);
  background:radial-gradient(closest-side, rgba(39,51,94,.22), transparent);
}

/* ---------- floating side-project icons ---------- */
.icon{
  position:absolute; left:0; top:0; z-index:4; display:block;
  width:var(--icon-size); height:var(--icon-size);
  transform:translate(-50%,-50%); visibility:hidden; -webkit-tap-highlight-color:transparent;
}
.icon.placed{ visibility:visible; }
.icon img{
  width:100%; height:100%; object-fit:contain; display:block;
  filter:drop-shadow(0 12px 14px rgba(120,70,60,.18));
  animation:bob 6s ease-in-out infinite; animation-delay:var(--d,0s);
  transition:transform .25s ease;
}
.icon:hover img,.icon:focus-visible img,.icon.active img{ transform:scale(1.08); }
.icon:focus-visible{ outline:3px solid var(--color-ink); outline-offset:6px; border-radius:22px; }
@keyframes bob{ 0%,100%{ translate:0 0 } 50%{ translate:0 -7px } }
.tip{
  position:absolute; left:var(--tl,50%); bottom:calc(100% + 6px); transform:translate(var(--tx,-50%),4px);
  padding:5px 11px; border-radius:12px; font-size:12px; line-height:1.25; font-weight:500; white-space:nowrap; text-align:center;
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.tip small{ display:block; font-weight:500; font-size:12px; opacity:.75; }
.icon[data-tipx="left"]{ --tl:0%; --tx:0%; }
.icon[data-tipx="right"]{ --tl:100%; --tx:-100%; }
.icon[data-tip="below"] .tip{ bottom:auto; top:calc(100% + 6px); transform:translate(var(--tx,-50%),-4px); }
.icon:hover .tip,.icon:focus-visible .tip,.icon.active .tip{ opacity:1; transform:translate(var(--tx,-50%),0); }

/* ---------- folder rail (vertical on desktop/tablet, horizontal on mobile) ---------- */
.railwrap{ position:relative; min-width:0; min-height:0; }
.rail{
  position:absolute; inset:0; overflow:hidden; touch-action:none; cursor:grab;
  -webkit-mask-image:linear-gradient(transparent 0, #000 var(--rail-fade), #000 calc(100% - var(--rail-fade)), transparent 100%);
          mask-image:linear-gradient(transparent 0, #000 var(--rail-fade), #000 calc(100% - var(--rail-fade)), transparent 100%);
}
.rail.drag{ cursor:grabbing; }
.rail-label{
  position:absolute; z-index:3; left:7px; top:50%; transform:translateY(-50%); pointer-events:none;
}
.dots{ display:flex; flex-direction:column; gap:8px; }
.dots i{ width:7px; height:7px; border-radius:50%; background:var(--color-ink); opacity:.25; transition:opacity .2s ease, transform .2s ease; }
.dots i.on{ opacity:.9; transform:scale(1.2); }
.track{ position:absolute; left:26px; right:22px; top:0; will-change:transform; }
.folder{
  display:block; position:relative; width:100%; aspect-ratio:520/452; margin-bottom:var(--folder-gap);
  color:var(--color-ink); text-decoration:none; flex:none; -webkit-tap-highlight-color:transparent;
  container-type:inline-size;
}
.folder .stack{ position:absolute; inset:0; filter:drop-shadow(0 8px 10px rgba(150,90,110,.12)); }
.folder .back,.folder .front{
  position:absolute; inset:0; width:100%; height:100%; display:block; -webkit-user-drag:none; user-select:none;
}
.folder .front{ transition:transform .45s cubic-bezier(.2,.8,.2,1); opacity:.6; }
/* frosted layer shaped like the front panel: it blurs only what is behind the front,
   i.e. the tucked-in part of the document, while the part sticking out stays sharp */
.folder .frost{
  position:absolute; left:.2%; top:24.1%; width:99.6%; height:75.7%; border-radius:9.2cqi;
  -webkit-backdrop-filter:blur(2.2cqi) saturate(1.1); backdrop-filter:blur(2.2cqi) saturate(1.1);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.folder:hover .frost,.folder:focus-visible .frost{ transform:translateY(.6cqi); }
/* the preview sits between the back and front panels; at rest its top 30% shows above the front panel */
.folder .paper{
  position:absolute; left:10%; width:80%; top:3.4%; aspect-ratio:4/3; overflow:hidden;
  border-radius:3.6cqi; background:#fff; border:.9cqi solid #fff;
  box-shadow:0 1.5cqi 4cqi rgba(80,50,90,.16);
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.folder .paper img{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; -webkit-user-drag:none; }
.folder .ph{
  width:100%; height:100%; border-radius:2.4cqi;
  background:
    linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)) 7% 11%/34% 6.5% no-repeat,
    linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)) 7% 25%/60% 3.6% no-repeat,
    linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)) 7% 31%/46% 3.6% no-repeat,
    linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 93% 11%/14% 6.5% no-repeat,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 7% 62%/40% 34% no-repeat,
    linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 93% 62%/40% 34% no-repeat,
    linear-gradient(160deg,hsl(var(--h) 62% 84%),hsl(calc(var(--h) + 38) 52% 74%));
}
.folder.current .paper,.folder:hover .paper,.folder:focus-visible .paper{ transform:translateY(var(--peek-rise)) rotate(-1.2deg); }
.folder:hover .front,.folder:focus-visible .front{ transform:translateY(.6cqi); }
.folder:focus-visible{ outline:none; }
.folder:focus-visible .name{ text-decoration:underline; text-underline-offset:.18em; text-decoration-thickness:.06em; }
.folder .label{ position:absolute; left:9%; right:9%; bottom:10%; pointer-events:none; text-align:left; text-shadow:0 0 2.4cqi rgba(255,255,255,.85), 0 0 .8cqi rgba(255,255,255,.7); }
.folder .name{

.vmodal{ position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px)); }

.vm-body{ position:relative; display:flex; flex-direction:column; align-items:center; gap:14px; max-width:100%; }
.vm-frame{
  position:relative; margin:0; height:min(76svh,760px); max-width:calc(100vw - 32px); aspect-ratio:720/1038;
  border-radius:30px; padding:10px; background:#fff; box-shadow:0 30px 70px rgba(30,24,50,.35);

  width:44px; height:44px; border-radius:50%; display:grid; place-items:center; cursor:pointer; padding:0; color:#fff; font:inherit;
}
.vm-sound{ position:absolute; right:22px; bottom:22px; }

/* fallback animation when view transitions are not supported */

@keyframes vmFade{ from{ opacity:0 } }
@keyframes vmPop{ from{ opacity:0; transform:scale(.92) translateY(10px) } }

/* ============ folder loop ============ */
const rail = document.getElementById('rail'), track = document.getElementById('track'), dotsEl = document.getElementById('dots');
PROJECTS.forEach(() => dotsEl.appendChild(document.createElement('i')));
const COPIES = 3;
for (let c = 0; c < COPIES; c++) PROJECTS.forEach(p => {
  const a = document.createElement('a');
  a.className = 'folder'; a.href = p.href; a.draggable = false;
  if (c !== 1) { a.tabIndex = -1; a.setAttribute('aria-hidden','true'); }
  a.style.setProperty('--h', p.h);
  const shot = p.img ? `<img src="${p.img}" alt="" draggable="false" loading="lazy">` : `<div class="ph"></div>`;
  a.innerHTML = `<span class="stack"><img class="back" src="${FOLDER}" alt="" draggable="false"><span class="paper">${shot}</span>`
    + `<span class="frost"></span><img class="front" src="${FOLDER_FRONT}" alt="" draggable="false"></span>`
    + `<span class="label"><span class="name">${p.t}</span>${p.meta ? `<span class="meta">${p.meta}</span>` : ''}</span>`;
  a.addEventListener('click', e => {
    if (p.href === '#' || moved) { e.preventDefault(); return; }
    // name this folder's preview so it grows into the case page's hero image
    const paper = a.querySelector('.paper');
    if (paper) paper.style.viewTransitionName = 'shot-' + p.t.toLowerCase().replace(/[^a-z]/g, '');
  });
  track.appendChild(a);
});
let axis = 'y', itemLen = 0, setLen = 0, pos = null, moved = false, touched = false;
function measureRail(){
  const newAxis = axisNow();
  if (newAxis !== axis) { axis = newAxis; pos = null; track.style.transform = ''; }
  const f = track.children[0], cs = getComputedStyle(f);
  itemLen = axis === 'y' ? f.offsetHeight + parseFloat(cs.marginBottom) : f.offsetWidth + parseFloat(cs.marginRight);
  setLen = itemLen * PROJECTS.length;
  const view = axis === 'y' ? rail.clientHeight : rail.clientWidth;
  if (pos === null) pos = -setLen + view * .08;
  applyRail();
}
function applyRail(){
  if (!setLen) return;
  while (pos > -setLen * .5) pos -= setLen;
  while (pos < -setLen * 1.5) pos += setLen;
  track.style.transform = axis === 'y' ? `translate3d(0,${pos}px,0)` : `translate3d(${pos}px,0,0)`;
  // the "current" project is the folder nearest the middle of the rail, where the dots sit
  const rr = rail.getBoundingClientRect();
  const target = axis === 'y' ? (rr.top + rr.bottom)/2 : (rr.left + rr.right)/2;
  let idx = 0, best = Infinity, cur = null;
  [...track.children].forEach((f, i) => {
    const r = f.getBoundingClientRect(), c = axis === 'y' ? (r.top + r.bottom)/2 : (r.left + r.right)/2;
    if (Math.abs(c - target) < best) { best = Math.abs(c - target); idx = i % PROJECTS.length; cur = f; }
  });
  [...track.children].forEach(f => f.classList.toggle('current', f === cur));
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === idx));
}
rail.addEventListener('wheel', e => {
  e.preventDefault(); touched = true;
  pos -= axis === 'y' ? e.deltaY : (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
  applyRail();
}, { passive:false });
let drag = null;
rail.addEventListener('pointerdown', e => { drag = { p0: axis === 'y' ? e.clientY : e.clientX, start:pos }; moved = false; touched = true; rail.classList.add('drag'); });
addEventListener('pointermove', e => {
  if (!drag) return;
  const d = (axis === 'y' ? e.clientY : e.clientX) - drag.p0;
  if (Math.abs(d) > 5) moved = true;
  pos = drag.start + d; applyRail();
});
function endDrag(){ drag = null; rail.classList.remove('drag'); setTimeout(() => moved = false, 0); }
addEventListener('pointerup', endDrag);
addEventListener('pointercancel', endDrag);
rail.addEventListener('focusin', e => {
  touched = true;
  const r = e.target.getBoundingClientRect(), rr = rail.getBoundingClientRect();
  if (axis === 'y' && (r.top < rr.top || r.bottom > rr.bottom)) pos += (rr.top + rr.height/2) - (r.top + r.height/2);
  if (axis === 'x' && (r.left < rr.left || r.right > rr.right)) pos += (rr.left + rr.width/2) - (r.left + r.width/2);
  applyRail();
});
/* one gentle glide on load, so people can see the rail moves */
function nudgeRail(){
  if (reduceMotion.matches || touched || !itemLen) return;
  const start = pos, dist = -itemLen * .55, dur = 1700, t0 = performance.now();
  (function step(now){
    if (touched) return;
    const t = Math.min(1, (now - t0) / dur);
    pos = start + dist * Math.sin(Math.PI * t);
    applyRail();
    if (t < 1) requestAnimationFrame(step); else { pos = start; applyRail(); }
  })(t0);
}

const hero = document.getElementById('hero'), bear = document.getElementById('bear');
let lastPointer = 'mouse';
addEventListener('pointerdown', e => { lastPointer = e.pointerType; }, true);
const iconEls = ICONS.map((it, i) => {
  const a = document.createElement('a');
  a.className = 'icon'; a.href = it.href; a.setAttribute('aria-label', `${it.name}: ${it.status}`);
  a.style.setProperty('--d', (-i * 1.7) + 's');

});
function activate(el){

  if (el) look(el.dataset.dir); else look('C');
}
document.addEventListener('pointerdown', e => { if (!e.target.closest('.icon')) activate(null); });

// arrangement from the design comp, as offsets from the bear's centre (order matches ICONS)
const REF = { w:1000, h:700, icon:120 };
const OFFSETS = [ { x:20, y:-260 }, { x:-250, y:170 }, { x:230, y:180 }, { x:-400, y:-110 } ];
function localRect(el, pad){
  const h = hero.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { l:r.left - h.left - pad, t:r.top - h.top - pad, r:r.right - h.left + pad, b:r.bottom - h.top + pad };
}
function placeBear(){
  // centre the bear in the free band between the intro and the bottom line
  bear.style.top = '50%';
  const H = hero.clientHeight, bh = bear.offsetHeight;
  const introB = localRect(document.getElementById('intro'), 0).b, t2T = localRect(document.getElementById('t2'), 0).t;
  if (H/2 - bh/2 < introB + 16 || H/2 + bh/2 > t2T - 16) bear.style.top = ((introB + t2T) / 2) + 'px';
}
function placeIcons(){
  const W = hero.clientWidth, H = hero.clientHeight, size = iconEls[0].offsetWidth, half = size / 2, edge = 8;
  const bearR = localRect(bear, 10);
  const bc = { x:(bearR.l + bearR.r)/2, y:(bearR.t + bearR.b)/2 };
  const blocks = [ bearR, localRect(document.getElementById('intro'), 10), localRect(document.getElementById('t2'), 10), localRect(document.getElementById('topbar'), 10) ];
  const s = Math.min(size / REF.icon, (W - edge*2) / REF.w, (H - edge*2) / REF.h);
  const placed = [];
  const ok = (x, y) =>
    x >= half + edge && x <= W - half - edge && y >= half + edge && y <= H - half - edge &&
    !blocks.some(b => x + half > b.l && x - half < b.r && y + half > b.t && y - half < b.b) &&
    !placed.some(p => Math.hypot(p.x - x, p.y - y) < size * 1.08);
  iconEls.forEach((el, i) => {
    const ix = bc.x + OFFSETS[i].x * s, iy = bc.y + OFFSETS[i].y * s;
    let spot = ok(ix, iy) ? { x:ix, y:iy } : null;
    // search outward from the ideal spot for the nearest free place
    for (let r = 6; !spot && r < Math.max(W, H); r += 6) {
      const n = Math.max(12, Math.round(r / 8));
      for (let k = 0; k < n && !spot; k++) {
        const a = k / n * Math.PI * 2 + Math.atan2(iy - bc.y, ix - bc.x);
        const x = ix + Math.cos(a) * r, y = iy + Math.sin(a) * r;
        if (ok(x, y)) spot = { x, y };
      }
    }
    if (!spot) spot = { x:Math.min(W - half - edge, Math.max(half + edge, ix)), y:Math.min(H - half - edge, Math.max(half + edge, iy)) };
    placed.push(spot);
    el.style.left = spot.x + 'px'; el.style.top = spot.y + 'px';
    el.dataset.dir = dirOf(spot.x - bc.x, spot.y - bc.y);
    el.dataset.tip = spot.y - half < 64 ? 'below' : 'above';
    el.dataset.tipx = spot.x < 100 ? 'left' : spot.x > W - 100 ? 'right' : 'center';
    el.classList.add('placed');
  });
}

/* ============ bear glance ============ */
const FULL = { C:[0,0,0,0], R:[3,0,1,0], L:[-3,0,-1,0], U:[0,-3,0,0], UR:[2,-2,1,0], UL:[-2,-2,-1,0], DR:[2,1,1,1], DL:[-2,1,-1,1] };
function dirOf(dx, dy){
  const a = Math.atan2(dy, dx) * 180 / Math.PI;
  const d = ['R','DR','D','DL','L','UL','U','UR'][((Math.round(a / 45) % 8) + 8) % 8];
  return d === 'D' ? (dx >= 0 ? 'DR' : 'DL') : d;
}
function dirTo(el){
  const b = bear.getBoundingClientRect(), r = el.getBoundingClientRect();
  return dirOf((r.left + r.right)/2 - (b.left + b.right)/2, (r.top + r.bottom)/2 - (b.top + b.bottom)/2);
}
const headg = document.getElementById('headg'), face = document.getElementById('face');
const cellPx = () => 12 * (bear.offsetWidth / 567);
function look(dir){
  const [fx,fy,hx,hy] = FULL[dir] || FULL.C, c = cellPx();
  headg.style.transform = `translate(${hx*c}px,${hy*c}px)`;
  face.style.transform = `translate(${fx*c}px,${fy*c}px)`;
}
iconEls.forEach(el => {
  const on = () => look(el.dataset.dir), off = () => { if (!el.classList.contains('active')) look('C'); };
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') on(); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') off(); });
  el.addEventListener('focus', on); el.addEventListener('blur', off);
});
const topbar = document.getElementById('topbar');
[[rail, () => dirTo(rail)], [topbar, () => dirTo(topbar)]].forEach(([el, d]) => {
  el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') look(d()); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') look('C'); });
  el.addEventListener('focusin', () => look(d()));
  el.addEventListener('focusout', () => look('C'));
});
/* ============ idle hop: after 10s without any input, the bear jumps (and again every 10s) ============ */
const IDLE_MS = 10000;
let idleT;
function hop(){
  if (!reduceMotion.matches && !document.hidden) {
    bear.classList.remove('jump'); void bear.offsetWidth; bear.classList.add('jump');
  }
  idleT = setTimeout(hop, IDLE_MS);
}
function resetIdle(){ clearTimeout(idleT); idleT = setTimeout(hop, IDLE_MS); }
bear.addEventListener('animationend', e => { if (e.animationName === 'hop') bear.classList.remove('jump'); });
['pointermove','pointerdown','wheel','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, resetIdle, { passive:true }));
document.addEventListener('visibilitychange', resetIdle);
resetIdle();

(function blink(){
  setTimeout(() => {
    if (reduceMotion.matches) return blink();
    bear.classList.add('blink'); setTimeout(() => { bear.classList.remove('blink'); blink(); }, 120);
  }, 2400 + Math.random()*3800);
})();


/* ============ "Who is in?" video modal (house icon) ============ */
const vmodal = document.getElementById('vmodal'), vmVideo = document.getElementById('vmVideo'),
      vmFrame = document.getElementById('vmFrame'), vmSound = document.getElementById('vmSound');
let vmOpener = null;
const canVT = () => typeof document.startViewTransition === 'function' && !reduceMotion.matches;
function setSound(on){
  vmVideo.muted = !on;
  vmSound.setAttribute('aria-pressed', String(on));
  vmSound.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
}
function openVideo(icon){
  vmOpener = icon;
  if (!vmVideo.src) vmVideo.src = vmVideo.dataset.src;
  setSound(false);
  const show = () => { vmodal.hidden = false; vmodal.querySelector('.vm-close').focus({ preventScroll:true }); };
  const img = icon.querySelector('img');
  if (canVT()) {
    img.style.viewTransitionName = 'ai-video';
    document.startViewTransition(() => { img.style.viewTransitionName = ''; vmFrame.style.viewTransitionName = 'ai-video'; show(); })
      .finished.finally(() => { vmFrame.style.viewTransitionName = ''; });
  } else { vmodal.classList.add('fade'); show(); }
  try { vmVideo.currentTime = 0; } catch (e) {}
  if (!reduceMotion.matches) vmVideo.play().catch(() => {}); else vmVideo.controls = true;
}
function closeVideo(){
  if (vmodal.hidden) return;
  vmVideo.pause(); setSound(false);
  const img = vmOpener && vmOpener.querySelector('img');
  const hide = () => { vmodal.hidden = true; vmodal.classList.remove('fade'); };
  if (canVT() && img) {
    vmFrame.style.viewTransitionName = 'ai-video';
    document.startViewTransition(() => { vmFrame.style.viewTransitionName = ''; img.style.viewTransitionName = 'ai-video'; hide(); })
      .finished.finally(() => { img.style.viewTransitionName = ''; });
  } else hide();
  if (vmOpener) { vmOpener.focus({ preventScroll:true }); activate(null); }
}
vmSound.addEventListener('click', () => { const on = vmVideo.muted; setSound(on); if (on) vmVideo.play().catch(() => {}); });
vmodal.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeVideo(); });
document.addEventListener('keydown', e => {
  if (vmodal.hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); closeVideo(); }
  if (e.key === 'Tab') {   // keep focus inside the dialog
    const f = [vmSound, vmodal.querySelector('.vm-close')];
    const i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  }
});

function layout(){ root.style.setProperty('--bear-scale', bear.offsetWidth / 567); measureRail(); placeBear(); placeIcons(); }
addEventListener('resize', layout);
addEventListener('load', () => { layout(); setTimeout(nudgeRail, 900); });
document.fonts && document.fonts.ready.then(layout);
layout();
</script>
